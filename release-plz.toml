# Every crate inherits workspace.package.version. Release-plz raises that shared
# version to the highest required bump and preserves inheritance in each crate.
[workspace]
release_always = false
# The full git-cliff config exposes render_always for unchanged lockstep crates.
changelog_config = "release-cliff.toml"

# Worker applications are deployed from this repository, never to crates.io.
[[package]]
name = "webfinger-service-worker"
release = false
publish = false

[[package]]
name = "webfinger-viewer-worker"
release = false
publish = false
