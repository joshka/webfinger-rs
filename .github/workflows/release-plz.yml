name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release-plz release
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        (
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Select release configuration
        id: release-config
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          config=release-plz.toml
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            config="$RUNNER_TEMP/release-plz-manual.toml"
            sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$config"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"
      - name: Run release-plz release
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e
        with:
          command: release
          config: ${{ steps.release-config.outputs.path }}
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Release-plz PR
    if: >-
      ${{
        github.repository_owner == 'joshka' &&
        github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore: release')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Run release-plz release-pr
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
