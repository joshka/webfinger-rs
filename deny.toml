[advisories]
version = 2
ignore = [
  # chrono is unmaintained with no safe upgrade; it only enters through the
  # `worker` crate used by the Cloudflare Worker binaries.
  { id = "RUSTSEC-2026-0543", reason = "transitive via worker; no maintained alternative upstream yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "EPL-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
